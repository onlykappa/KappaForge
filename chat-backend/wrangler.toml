name = "kappaforge-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Keep owner-managed routing variables configured in the Cloudflare dashboard when deploying.
keep_vars = true

# Phase 3 routing is deliberately fail-closed. Owner-reviewed free eligibility and
# per-channel permissions are dashboard-managed variables; keep them out of this config
# so deployment cannot replace them with blank defaults.
[vars]
ROUTING_POLICY_VERSION = "v1"
KAPPA_ROUTER_MAX_DAILY_REQUESTS = "100"
KAPPA_ROUTER_MAX_PER_MINUTE = "20"

[[durable_objects.bindings]]
name = "MEMORY"
class_name = "KappaMemory"

[[migrations]]
tag = "memory_v1"
new_sqlite_classes = ["KappaMemory"]

[ai]
binding = "AI"

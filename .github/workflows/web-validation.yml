name: Shared web regression
on:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-web.py
      - run: node --test tests/intelligence.test.mjs chat-backend/vector-index.test.mjs
      - run: python -m unittest discover -s tests -v
      - name: Install browser regression dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install desktop Chromium and Safari WebKit test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test real interface on desktop and mobile WebKit
        run: node tests/web-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-regression-screenshots
          path: /tmp/kappaforge-*.png
          if-no-files-found: ignore

name: Sandbox self-test
# Phase 1 execution sandbox on a real GitHub-hosted runner: the real-Docker tests (isolation, limits, locked npm ci) and
# KappaForge's own Python and Node suites run inside the sandbox. No secrets; the token stays read-only.
on:
  pull_request:
    paths:
    - engine/sandbox.py
    - engine/sandbox_repair_controller.py
    - engine/execution.py
    - engine/infrastructure.py
    - engine/generation_checkpoint.py
    - engine/sandbox_tools.py
    - engine/tool_loop.py
    - tests/test_sandbox.py
    - tests/test_sandbox_repair_controller.py
    - tests/test_sandbox_repair_integration.py
    - tests/test_execution_recovery.py
    - tests/test_infrastructure.py
    - tests/test_phase1_acceptance.py
    - tests/test_phase2_exploration_repair.py
    - tests/test_phase3_acceptance.py
    - engine/review_ingestion.py
    - engine/review_threads.py
    - engine/review_repair.py
    - engine/exploration.py
    - tests/fixtures/sandbox/**
    - tools/sandbox_selftest.py
    - .github/workflows/sandbox-selftest.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Verify free execution permissions and resource availability
      run: python -m engine.infrastructure
    - name: Real-Docker sandbox tests
      env:
        KAPPA_SANDBOX_INTEGRATION: '1'
        KAPPA_SANDBOX_NETWORK: '1'
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest tests.test_sandbox -v
      shell: bash
    - name: Faulty project repaired through the agent tool loop
      env:
        KAPPA_SANDBOX_INTEGRATION: '1'
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest tests.test_sandbox_repair_integration -v
      shell: bash
    - name: Phase 1 acceptance requirements on the faulty invoice fixture
      env:
        KAPPA_SANDBOX_INTEGRATION: '1'
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest tests.test_phase1_acceptance -v
      shell: bash
    - name: Phase 2 exploration inside sandbox repair on the shop fixture
      env:
        KAPPA_SANDBOX_INTEGRATION: '1'
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest tests.test_phase2_exploration_repair -v
      shell: bash
    - name: Phase 3 scoped review and draft publication acceptance
      env:
        KAPPA_SANDBOX_INTEGRATION: '1'
      run: python -m unittest tests.test_phase3_acceptance -v
      shell: bash
    - name: Phase 3 source-bound browser demonstration dependencies
      run: |
        for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$source" ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"; fi
        done
        npm ci --ignore-scripts --no-audit --no-fund
        npx playwright install --with-deps chromium
      shell: bash
    - name: Phase 3 controlled review-to-visual acceptance
      run: node tools/phase3-visual-demo.cjs
      shell: bash
    - name: Preserve controlled Phase 3 acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-controlled-acceptance
        path: /tmp/kappaforge-phase3-demo/**
        if-no-files-found: warn
    - name: KappaForge's own suites inside the sandbox
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m tools.sandbox_selftest
      shell: bash
    - name: Nothing left behind
      if: always()
      run: |-
        set -Eeuo pipefail
        left=$(docker ps -aq --filter label=kappaforge.sandbox; docker volume ls -q --filter label=kappaforge.sandbox)
        if [ -n "$left" ]; then echo "::error::Sandbox containers or volumes were left behind: $left"; exit 1; fi
      shell: bash

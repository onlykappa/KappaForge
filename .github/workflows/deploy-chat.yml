name: Deploy KappaForge Chat
permissions:
  contents: read
concurrency:
  group: kappaforge-chat-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Inspect chat permission without inference or configuration writes
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node chat-backend/tools/verify-settings.mjs inspect
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'inspect'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install locked Worker deployment tools
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Preflight worker tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py worker
    - name: Check Worker JavaScript syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        node --check chat-backend/src/index.js
      shell: bash
    - name: Test vector index behavior
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        node --test tests/intelligence.test.mjs chat-backend/vector-index.test.mjs tests/actions.test.mjs
      shell: bash
    - name: Verify Wrangler can build Worker
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm run build:check
      shell: bash
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'onlykappa' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install locked Worker deployment tools
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Preflight worker tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py worker
    - name: Snapshot production bindings without logging values
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        OPERATION: ${{ inputs.operation }}
      run: |
        if [ "$OPERATION" = "repair-chat" ] || [ "$OPERATION" = "activate-providers" ]; then
          node chat-backend/tools/verify-settings.mjs snapshot "$RUNNER_TEMP/kappa-worker-bindings.json" "$OPERATION"
        else
          node chat-backend/tools/verify-settings.mjs snapshot "$RUNNER_TEMP/kappa-worker-bindings.json"
        fi
    - name: Deploy Worker
      id: deploy
      working-directory: chat-backend
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        OPERATION: ${{ inputs.operation }}
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
        test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
        node tools/verify-settings.mjs assert-unchanged "$RUNNER_TEMP/kappa-worker-bindings.json"
        if [ "$OPERATION" = "repair-chat" ]; then
          npm run deploy -- --var "KAPPA_BUILD_SHA:$GITHUB_SHA" --var KAPPA_CHAT_PROVIDERS:groq 2>&1 | tee deploy.log
        elif [ "$OPERATION" = "activate-providers" ]; then
          provider_args=()
          while IFS= read -r permission; do provider_args+=(--var "$permission"); done < <(
            node --input-type=module -e 'import{readFileSync}from"node:fs";const s=JSON.parse(readFileSync(process.argv[1],"utf8"));for(const [name,value]of Object.entries(s.variables))console.log(name+":"+value)' "$RUNNER_TEMP/kappa-worker-bindings.json"
          )
          test "${#provider_args[@]}" = "8" || { echo "::error::Expected exactly four reviewed provider variables."; exit 1; }
          npm run deploy -- --var "KAPPA_BUILD_SHA:$GITHUB_SHA" "${provider_args[@]}" 2>&1 | tee deploy.log
        else
          npm run deploy -- --var "KAPPA_BUILD_SHA:$GITHUB_SHA" 2>&1 | tee deploy.log
        fi
        echo "url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Health check, rolling back automatically if the new Worker is broken
      working-directory: chat-backend
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WORKER_URL: ${{ steps.deploy.outputs.url }}
      run: |
        set -Eeuo pipefail
        if [ -z "$WORKER_URL" ]; then echo "::warning::Deployed Worker URL not found in output; health check skipped."; exit 0; fi
        for attempt in 1 2 3 4 5 6; do
          if curl -fsS --max-time 10 "$WORKER_URL/health" | grep -q '"ok":true'; then echo "Worker healthy"; exit 0; fi
          sleep 10
        done
        echo "::error::New Worker failed its health check; rolling back to the previous version."
        npx wrangler rollback --message "Automatic rollback: health check failed for $GITHUB_SHA" --yes
        exit 1
      shell: bash
    - name: Verify production bindings survived deployment
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node chat-backend/tools/verify-settings.mjs verify "$RUNNER_TEMP/kappa-worker-bindings.json"
    - name: Verify Cloudflare applied the configured paid Worker limits
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node chat-backend/tools/verify-settings.mjs verify-resources
    - name: Verify runner inference authentication without calling a provider
      env:
        WORKER_URL: ${{ steps.deploy.outputs.url }}
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
      run: |
        set -Eeuo pipefail
        test -n "$WORKER_URL" || { echo "::error::Deployed Worker URL is missing."; exit 1; }
        test -n "$KAPPA_ROUTER_URL" || { echo "::error::KAPPA_ROUTER_URL Actions variable is missing."; exit 1; }
        test -n "$KAPPA_ROUTER_TOKEN" || { echo "::error::KAPPA_ROUTER_TOKEN Actions secret is missing."; exit 1; }
        configured_url="${KAPPA_ROUTER_URL%/}"
        deployed_url="${WORKER_URL%/}"
        test "$configured_url" = "$deployed_url" || { echo "::error::KAPPA_ROUTER_URL does not match the deployed Worker."; exit 1; }
        status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/router/infer" -H 'Content-Type: application/json' --data '{}')
        test "$status" = "401" || { echo "::error::Unauthenticated inference request returned HTTP $status (expected 401)."; exit 1; }
        status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/router/infer" -H 'Content-Type: application/json' -H "Authorization: Bearer $KAPPA_ROUTER_TOKEN" --data '{')
        test "$status" = "400" || { echo "::error::Authenticated malformed request returned HTTP $status (expected 400, no provider call)."; exit 1; }
        status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/router/infer" -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-smoke-token' --data '{}')
        case "$status" in
          401|403) ;;
          *) echo "::error::Invalid inference credential returned HTTP $status (expected 401 or 403)."; exit 1 ;;
        esac
        echo "Runner-only inference endpoint passed URL and authentication checks without a provider call."
      shell: bash
    - name: Diagnose Groq route without inference
      if: contains(github.event.head_commit.message, '[router-free-live-smoke]') || contains(github.event.head_commit.message, '[router-diagnostics-only]') || inputs.operation == 'repair-chat'
      env:
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
      run: |
        set -Eeuo pipefail
        diagnostics=$(curl -fsS --max-time 20 \
          -H "Authorization: Bearer $KAPPA_ROUTER_TOKEN" \
          "${KAPPA_ROUTER_URL%/}/router/diagnostics") || {
          echo "::error::Sanitized Groq diagnostics endpoint was unavailable; no inference was attempted."
          exit 1
        }
        printf '%s\n' "$diagnostics" | jq '{provider,model,failedCondition,chatPolicy,bindings,allowlists,capabilities,modelPolicy,discovery,health,gatewayLimits,providerQuota}'
        condition=$(printf '%s' "$diagnostics" | jq -r '.failedCondition')
        test "$condition" = "eligible" || {
          echo "::error::Groq route is not inference-eligible ($condition); no provider inference was attempted."
          exit 1
        }
        if [ "${{ inputs.operation }}" = "repair-chat" ]; then
          printf '%s' "$diagnostics" | jq -e '.chatPolicy.permissionConfigured and .chatPolicy.groqAllowed and .chatPolicy.credentialPresent' >/dev/null
          echo "Runtime Groq chat permission and credential presence passed; no inference was attempted."
        fi
      shell: bash
    - name: Verify one explicitly free Groq route (one request, no fallback)
      if: contains(github.event.head_commit.message, '[router-free-live-smoke]')
      env:
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
      run: |
        set -Eeuo pipefail
        response_file=$(mktemp)
        trap 'rm -f "$response_file"' EXIT
        status=$(curl -sS --max-time 130 -o "$response_file" -w '%{http_code}' \
          -X POST "${KAPPA_ROUTER_URL%/}/router/infer" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $KAPPA_ROUTER_TOKEN" \
          --data '{"version":1,"channel":"coding","privateCode":true,"repo":"onlykappa/KappaForge","messages":[{"role":"user","content":"Reply with exactly: live route ok"}],"providers":["groq"],"model":"groq:openai/gpt-oss-120b","fallback":false,"maxTokens":256,"reasoningEffort":"low"}')
        if [ "$status" != "200" ]; then
          error_code=$(jq -r '.code // "unknown"' "$response_file" 2>/dev/null || echo unknown)
          echo "::error::The one-shot free Groq route returned HTTP $status ($error_code); no alternate route was attempted."
          exit 1
        fi
        route=$(jq -er '.route' "$response_file")
        test "$route" = "groq:openai/gpt-oss-120b" || { echo "::error::The live smoke selected an unexpected route."; exit 1; }
        usage=$(jq -c '.usage // null' "$response_file")
        echo "One-shot live inference passed on $route; usage=$usage; fallback=false."
      shell: bash
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, deploy, repair chat, or activate configured reviewed free providers
        type: choice
        default: deploy
        options:
        - deploy
        - inspect
        - repair-chat
        - activate-providers
defaults:
  run:
    shell: bash

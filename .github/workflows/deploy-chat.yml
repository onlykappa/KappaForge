name: Deploy KappaForge Chat
permissions:
  contents: read
concurrency:
  group: kappaforge-chat-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install locked Worker deployment tools
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Preflight worker tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py worker
    - name: Check Worker JavaScript syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        node --check chat-backend/src/index.js
      shell: bash
    - name: Test vector index behavior
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        node --test tests/intelligence.test.mjs chat-backend/vector-index.test.mjs tests/actions.test.mjs
      shell: bash
    - name: Verify Wrangler can build Worker
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm run build:check
      shell: bash
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install locked Worker deployment tools
      working-directory: chat-backend
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Preflight worker tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py worker
    - name: Deploy Worker
      id: deploy
      working-directory: chat-backend
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
        test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
        npm run deploy 2>&1 | tee deploy.log
        echo "url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Health check, rolling back automatically if the new Worker is broken
      working-directory: chat-backend
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WORKER_URL: ${{ steps.deploy.outputs.url }}
      run: |
        set -Eeuo pipefail
        if [ -z "$WORKER_URL" ]; then echo "::warning::Deployed Worker URL not found in output; health check skipped."; exit 0; fi
        for attempt in 1 2 3 4 5 6; do
          if curl -fsS --max-time 10 "$WORKER_URL/health" | grep -q '"ok":true'; then echo "Worker healthy"; exit 0; fi
          sleep 10
        done
        echo "::error::New Worker failed its health check; rolling back to the previous version."
        npx wrangler rollback --message "Automatic rollback: health check failed for $GITHUB_SHA" --yes
        exit 1
      shell: bash
'on':
  push:
    branches:
    - main
    paths:
    - chat-backend/**
    - config/providers.json
    - config/app.json
    - preview/stream.js
    - preview/actions-core.js
    - .github/workflows/deploy-chat.yml
    - tests/intelligence.test.mjs
  workflow_dispatch: null
defaults:
  run:
    shell: bash

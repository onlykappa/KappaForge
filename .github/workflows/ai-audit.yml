name: AI Audit
# Comment /audit-code on a KappaForge task issue to run (or re-run) the agent on it.
permissions:
  contents: read
jobs:
  audit:
    # Owner comments on owner-labelled task issues only; pull request comments are ignored.
    if: >-
      startsWith(github.event.comment.body, '/audit-code') &&
      github.event.comment.user.login == 'onlykappa' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'kappa-task')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
    steps:
    - name: Start the agent for this issue
      uses: actions/github-script@v7
      with:
        script: |
          const issue_number = context.payload.issue.number;
          await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'agent.yml', ref: 'main',
            inputs: {issue_number: String(issue_number)}});
          await github.rest.reactions.createForIssueComment({...context.repo, comment_id: context.payload.comment.id, content: 'rocket'});
'on':
  issue_comment:
    types:
    - created

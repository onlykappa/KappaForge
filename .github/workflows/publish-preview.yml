name: Publish KappaForge Web
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'chat-backend/**'
      - 'ios/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/publish-preview.yml'
      - '.github/workflows/web-validation.yml'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kappaforge-pages-${{ github.sha }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/web-validation.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded source before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/onlykappa/KappaForge/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
  ios:
    needs: deploy
    uses: ./.github/workflows/ios-build.yml
    permissions:
      contents: write

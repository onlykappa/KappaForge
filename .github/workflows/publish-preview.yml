name: Publish KappaForge Preview
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kappaforge-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("preview/index.html").read_text()
          if html.count("<script>") != 1 or html.count("</script>") != 1:
              raise SystemExit("Expected one inline script in preview")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/kappaforge-preview.js").write_text(js)
          PY
          node --check /tmp/kappaforge-preview.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4

name: KappaForge tests
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest discover -s tests -v
      shell: bash
'on':
  push:
    branches:
    - main
  pull_request: null
defaults:
  run:
    shell: bash

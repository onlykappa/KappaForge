name: KappaForge tests
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install ast-grep so the structural scan tests run for real
      run: python -m pip install --quiet --no-deps --require-hashes -r .github/ast-grep-requirements.txt
      shell: bash
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest discover -s tests -v
      shell: bash
    - name: Check the dependency map the chat reads is current
      # A warning, not a failure: agent-written PRs cannot run the generator themselves.
      run: python3 scripts/dependency-map.py --check || echo "::warning title=dependency map::dependency_map.json is stale; run python3 scripts/dependency-map.py"
      shell: bash
    - name: Verify the reviewed free execution workflow manifest
      run: python3 scripts/execution-policy.py --check
      shell: bash
  structure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install ast-grep
      run: python -m pip install --quiet --no-deps --require-hashes -r .github/ast-grep-requirements.txt
      shell: bash
    - name: Test the structural security rules
      run: ast-grep test --skip-snapshot-tests
      shell: bash
    - name: Scan the shipped code
      # Test fixtures hold fake keys and dev tools start processes on purpose; the iOS folder copies preview/.
      # Errors fail the job; warnings (HTML built from variables) are listed for review.
      run: ast-grep scan --globs '!tests/**' --globs '!chat-backend/tools/**' --globs '!ios/KappaForge/Web/**' --globs '!.ast-grep/**'
      shell: bash
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: chat-backend/package-lock.json
    - run: npm ci
      working-directory: chat-backend
    - name: Build Worker without deployment or production credentials
      run: npm run build:check
      working-directory: chat-backend
    - name: Verify persistent automatic recovery alarms in isolated workerd
      run: node chat-backend/tools/recovery-runtime-check.mjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm test
    - name: Use the Ubuntu archive for browser dependencies
      # The runner's Azure mirror repeatedly exhausted this job's timeout downloading fonts/codecs.
      # Keep the same signed Ubuntu packages and the full Chromium/WebKit dependency installation.
      run: |
        for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$source" ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
          fi
        done
    - run: npx playwright install --with-deps chromium webkit
    - run: npm run test:web
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-regression-evidence
        path: /tmp/kappaforge-*.png
        if-no-files-found: warn
'on':
  push:
    branches:
    - main
  pull_request: null
defaults:
  run:
    shell: bash

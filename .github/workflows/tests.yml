name: KappaForge tests
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest discover -s tests -v
      shell: bash
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm test
    - run: npx playwright install --with-deps chromium webkit
    - run: npm run test:web
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-regression-evidence
        path: /tmp/kappaforge-*.png
        if-no-files-found: warn
'on':
  push:
    branches:
    - main
  pull_request: null
defaults:
  run:
    shell: bash

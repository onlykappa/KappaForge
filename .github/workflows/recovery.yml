name: Resume authorized development
run-name: ${{ inputs.issue_number != '' && format('Recovery task #{0}', inputs.issue_number) || 'Scheduled recovery scan' }}
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: kappaforge-recovery-dispatch
  cancel-in-progress: false
jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Dispatch due task continuations without running candidate code
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KAPPA_CODER_TOKEN: ${{ secrets.KAPPA_CODER_TOKEN }}
        KAPPA_RECOVERY_TASK: ${{ inputs.issue_number }}
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
      run: python -m engine.recovery
'on':
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing task only; authorization and checkpoint are rechecked
        type: string
        required: false
  schedule:
  # GitHub supports no shorter interval; schedules are best-effort, not deadlines.
  - cron: '2-57/5 * * * *'

# Weekly check of the free model list; maintained by KappaForge.
# Weekly check of the free model list; maintained by KappaForge.
name: Free LLM list drift
run-name: Compare the AI providers with the free LLM API list
# Weekly: reads the public mnfst/awesome-free-llm-apis data file and reports providers KappaForge does not use yet and
# pinned free models the list no longer shows. No provider keys; it never changes the config.
on:
  schedule:
  - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Compare with the list
      shell: bash
      run: |-
        set -Eeuo pipefail
        python -m engine.free_list_check --out "$RUNNER_TEMP/free-llm-drift.md"
    - name: Open or update the drift issue
      uses: actions/github-script@v7
      env:
        REPORT: ${{ runner.temp }}/free-llm-drift.md
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.REPORT, 'utf8').trim();
          const label = 'free-llm-drift';
          const {owner, repo} = context.repo;
          const open = (await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: label, per_page: 10}))
            .data.filter(i => !i.pull_request);
          if (!body) { core.info('KappaForge matches the free LLM list.'); return; }
          if (open.length && (open[0].body || '').trim() === body) { core.info('Drift issue unchanged'); return; }
          if (open.length) {
            await github.rest.issues.update({owner, repo, issue_number: open[0].number, body});
            core.info('Drift issue updated: #' + open[0].number);
          } else {
            const made = await github.rest.issues.create({owner, repo, title: 'Free LLM list changed', body, labels: [label]});
            core.info('Drift issue opened: #' + made.data.number);
          }

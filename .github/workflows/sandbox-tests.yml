name: Sandbox branch tests
run-name: Sandbox validation ${{ inputs.branch }} @ ${{ inputs.candidate_sha }}
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(inputs.branch, 'kappa/issue-') || startsWith(inputs.branch, 'kappa/repair-') || startsWith(inputs.branch, 'kappa/cont-') || startsWith(inputs.branch, 'kappa/dev-') || startsWith(inputs.branch, 'kappa/revert-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        # Test the exact commit the dashboard will offer to merge.
        ref: ${{ inputs.candidate_sha || inputs.branch }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Run Python tests without API secrets
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest discover -s tests -v
      shell: bash
    - name: Check generated source compiles
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m compileall -q engine scripts tools tests
      shell: bash
    - name: Check Worker and preview JavaScript syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python scripts/check-web.py
      shell: bash
    - name: Run Worker and app logic tests
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        node --test tests/intelligence.test.mjs chat-backend/vector-index.test.mjs
      shell: bash
    - name: Check repair engine syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m compileall -q engine
      shell: bash
  notify:
    # Separate job: never checks out or runs the tested code, so the webhook secret and its token are not exposed to it.
    needs: verify
    if: always() && inputs.candidate_sha != '' && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      issues: write
    steps:
    - name: Start an automatic fix for a failed agent development PR
      # Only reads the branch name; the agent fixes it from KappaForge's trusted main, at most a few times per PR.
      if: needs.verify.result == 'failure' && startsWith(inputs.branch, 'kappa/dev-')
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        [[ "$BRANCH" =~ ^kappa/dev-([0-9]+)$ ]] || exit 0
        gh workflow run agent.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="${BASH_REMATCH[1]}" -f action=fix || echo "::warning::Could not start the automatic fix; tap Fix it on the Dashboard."
      shell: bash
    - name: Post the test result on the task, where the chat sees it
      # kappa/dev-N belongs to task issue N. Only the branch name and the result are used.
      if: startsWith(inputs.branch, 'kappa/dev-')
      env:
        GH_TOKEN: ${{ github.token }}
        RESULT: ${{ needs.verify.result }}
        BRANCH: ${{ inputs.branch }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [[ "$BRANCH" =~ ^kappa/dev-([0-9]+)$ ]] || exit 0
        issue="${BASH_REMATCH[1]}"
        if [ "$RESULT" = success ]; then
          body=$(printf '### Tests passed ✅ — ready to merge\n\nAll tests passed on the latest commit of `%s`. Review and merge it on the Dashboard.\n\n[Test log](%s)' "$BRANCH" "$RUN_URL")
        else
          body=$(printf '### Tests failed ❌ — fixing\n\nTests failed on the latest commit of `%s`. KappaForge is starting a fix automatically; if it gets stuck it will ask for your guidance.\n\n[Test log](%s)' "$BRANCH" "$RUN_URL")
        fi
        gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body" || echo "::warning::Could not post the test result on task $issue."
      shell: bash
    - name: Post the test result to Discord
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        RESULT: ${{ needs.verify.result }}
        BRANCH: ${{ inputs.branch }}
        TARGET: KappaForge ${{ inputs.branch }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [[ "$DISCORD_WEBHOOK_URL" =~ ^https://(discord|discordapp)\.com/api/webhooks/ ]] || exit 0
        python3 -c 'import json,os;ok=os.environ["RESULT"]=="success";print(json.dumps({"content":("✅ Tests passed for " if ok else "❌ Tests failed for ")+os.environ["TARGET"]+(". Merge is ready on the Dashboard." if ok else (". KappaForge is fixing it automatically." if os.environ["BRANCH"].startswith("kappa/dev-") else ". Tap Fix it on the Dashboard."))+"\n"+os.environ["RUN_URL"],"allowed_mentions":{"parse":[]}}))' > payload.json
        curl -fsS -m 15 -H 'Content-Type: application/json' -d @payload.json "$DISCORD_WEBHOOK_URL" >/dev/null || true
      shell: bash
'on':
  workflow_dispatch:
    inputs:
      branch:
        description: KappaForge generated branch (kappa/issue-N, kappa/repair-N, kappa/cont-N-M, or kappa/dev-N)
        required: true
        type: string
      candidate_sha:
        description: Exact generated branch SHA for automatic repair eligibility
        required: false
        type: string
defaults:
  run:
    shell: bash

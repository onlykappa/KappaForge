name: Sandbox branch tests
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "KappaForge generated branch (kappa/issue-N, kappa/repair-N, or kappa/cont-N-M)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(inputs.branch, 'kappa/issue-') || startsWith(inputs.branch, 'kappa/repair-') || startsWith(inputs.branch, 'kappa/cont-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tests without API secrets
        run: python -m unittest discover -s tests -v
      - name: Check generated source compiles
        run: python -m compileall -q projects tests/projects
      - name: Check Worker and preview JavaScript syntax
        run: |
          node --check chat-backend/src/index.js
          python - <<'PY'
          from pathlib import Path
          html = Path('preview/index.html').read_text()
          if html.count('<script>') != 1 or html.count('</script>') != 1:
              raise SystemExit('Unexpected preview script count')
          Path('/tmp/kappaforge-preview.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/kappaforge-preview.js
      - name: Check repair engine syntax
        run: python -m compileall -q engine

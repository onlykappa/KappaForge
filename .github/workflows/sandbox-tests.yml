name: Sandbox branch tests
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "KappaForge generated branch (kappa/issue-N)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(inputs.branch, 'kappa/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tests without API secrets
        run: python -m unittest discover -s tests -v
      - name: Check generated source compiles
        run: python -m compileall -q projects tests/projects

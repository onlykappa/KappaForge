name: Sandbox branch tests
run-name: Sandbox validation ${{ inputs.branch }} @ ${{ inputs.candidate_sha }}
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(inputs.branch, 'kappa/issue-') || startsWith(inputs.branch, 'kappa/repair-') || startsWith(inputs.branch, 'kappa/cont-') || startsWith(inputs.branch, 'kappa/dev-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Run Python tests without API secrets
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m unittest discover -s tests -v
      shell: bash
    - name: Check generated source compiles
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m compileall -q projects tests/projects
      shell: bash
    - name: Check Worker and preview JavaScript syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python scripts/check-web.py
      shell: bash
    - name: Check repair engine syntax
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m compileall -q engine
      shell: bash
'on':
  workflow_dispatch:
    inputs:
      branch:
        description: KappaForge generated branch (kappa/issue-N, kappa/repair-N, kappa/cont-N-M, or kappa/dev-N)
        required: true
        type: string
      candidate_sha:
        description: Exact generated branch SHA for automatic repair eligibility
        required: false
        type: string
defaults:
  run:
    shell: bash

name: iOS build and release
# Agent dispatches are named "iOS build <branch> @ <sha>" so the agent and chat can find the build of an exact commit.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '' && format('iOS build {0} @ {1}', inputs.branch, inputs.candidate_sha) || ' ' }}
permissions:
  contents: read
jobs:
  sandbox:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'kappa/issue-')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.candidate_sha || inputs.branch }}
        persist-credentials: false
    - name: Verify candidate checkout
      if: inputs.candidate_sha != ''
      env:
        CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      shell: bash
      run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
    - run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        brew install xcodegen
      shell: bash
    - name: Preflight native tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py native
    - name: Generate existing agent sandbox project
      working-directory: projects/kappaforge_ios
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        xcodegen generate
      shell: bash
    - name: Compile existing agent sandbox simulator app
      working-directory: projects/kappaforge_ios
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      shell: bash
  native:
    if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.branch, 'kappa/issue-')
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.candidate_sha || inputs.branch || github.sha }}
        persist-credentials: false
    - name: Verify candidate checkout
      if: github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
      env:
        CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      shell: bash
      run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
    - name: Choose the release version (next patch when the configured one is already published)
      id: version
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        NOTES=$(git log -1 --format=%s)
        VERSION=$(gh release list --repo onlykappa/KappaForge --limit 100 --json tagName --jq '.[].tagName' | python3 scripts/release-version.py --apply --notes "$NOTES")
        python3 scripts/configure.py
        python3 scripts/bundle-web.py
        echo "Building version $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Install XcodeGen
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        brew install xcodegen
      shell: bash
    - name: Preflight native tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py native
    - name: Verify native update contract
      run: node --test tests/native-update-contract.test.mjs
    - name: Verify shared source and bundle latest interface
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/check-web.py
      shell: bash
    - name: Generate KappaForge app icon
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        swift ios/generate-icon.swift
      shell: bash
    - name: Generate native project
      working-directory: ios
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        xcodegen generate
      shell: bash
    - name: Build simulator application
      id: simulator_build
      working-directory: ios
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build
      shell: bash
    - name: Boot simulator and verify bundled launch
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        set -euo pipefail
        DEVICE=$(xcrun simctl list devices available -j | python3 scripts/select-simulator.py)
        [[ "$DEVICE" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { echo "Invalid simulator UUID"; exit 1; }
        xcrun simctl boot "$DEVICE"
        xcrun simctl bootstatus "$DEVICE" -b
        xcrun simctl install "$DEVICE" ios/simulator-build/Build/Products/Debug-iphonesimulator/KappaForge.app
        APP_ID=$(python3 scripts/config-value.py iosBundleIdentifier)
        xcrun simctl launch "$DEVICE" "$APP_ID"
        xcodebuild -project ios/KappaForge.xcodeproj -scheme KappaForge -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/simulator-build -resultBundlePath /tmp/kappaforge-ui-tests.xcresult CODE_SIGNING_ALLOWED=NO test
        # XCTest may terminate the app. Relaunch, then reject empty/white captures.
        xcrun simctl terminate "$DEVICE" "$APP_ID" || true
        xcrun simctl launch "$DEVICE" "$APP_ID"
        for ATTEMPT in $(seq 1 18); do
          sleep 3
          xcrun simctl io "$DEVICE" screenshot /tmp/kappaforge-ios-launch.png
          if swift scripts/validate-simulator-screenshot.swift /tmp/kappaforge-ios-launch.png; then
            echo "Verified rendered simulator screenshot on attempt $ATTEMPT"
            break
          fi
          if [ "$ATTEMPT" -eq 18 ]; then
            echo "::error::Simulator screenshot still blank after 54 seconds"
            exit 1
          fi
        done
      shell: bash
    - name: Export keyboard screenshots for inspection
      if: always()
      run: |
        if [ -d /tmp/kappaforge-ui-tests.xcresult ]; then
          xcrun xcresulttool export attachments --path /tmp/kappaforge-ui-tests.xcresult --output-path /tmp/kappaforge-ui-attachments
        fi
    - name: Preserve keyboard screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iOS-keyboard-screenshots
        path: /tmp/kappaforge-ui-attachments
        if-no-files-found: warn
        retention-days: 14
    - name: Preserve iOS simulator UI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iOS-keyboard-ui-test-results
        path: /tmp/kappaforge-ui-tests.xcresult
        if-no-files-found: warn
        retention-days: 14
    - name: Build unsigned iPhone application
      # Runs even when a simulator UI test failed: the device build is its own compile check and the IPA stays inspectable.
      # The job still fails, so a failed test never reaches the release job.
      if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
      working-directory: ios
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      shell: bash
    - name: Verify bundle, icon and package unsigned IPA
      if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
      working-directory: ios
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        set -euo pipefail
        APP=build/Build/Products/Release-iphoneos/KappaForge.app
        test -s "$APP/Assets.car"
        test -s "$APP/AppIcon60x60@2x.png"
        # Every shared web file, not a hand-kept list, must ship byte-identical in the app.
        for SRC in ../preview/*; do if [ -f "$SRC" ]; then cmp "$SRC" "$APP/Web/$(basename "$SRC")"; fi; done
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "$(python3 ../scripts/config-value.py iosBundleIdentifier)"
        mkdir -p package/Payload
        cp -R "$APP" package/Payload/
        cd package
        /usr/bin/zip -qry ../KappaForge-unsigned.ipa Payload
        unzip -t ../KappaForge-unsigned.ipa
      shell: bash
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.simulator_build.outcome == 'success' }}
      with:
        name: KappaForge-unsigned-iPhone-IPA
        path: ios/KappaForge-unsigned.ipa
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: iOS-launch-screenshot
        path: /tmp/kappaforge-ios-launch.png
        if-no-files-found: warn
  agent-report:
    # An agent development branch: report the native result on its task, and start a fix when it failed.
    needs: native
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'kappa/dev-') && inputs.candidate_sha != '' && (needs.native.result == 'success' || needs.native.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      issues: write
      contents: read
    steps:
    - name: Report the iOS build on the task and start a fix when it failed
      env:
        GH_TOKEN: ${{ github.token }}
        RESULT: ${{ needs.native.result }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.candidate_sha }}
        CHECK_RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        [[ "$BRANCH" =~ ^kappa/dev-([0-9]+)$ ]] || exit 0
        issue="${BASH_REMATCH[1]}"
        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
        head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
        if [ "$head" != "$SHA" ]; then
          echo "::notice::$BRANCH moved on; the newer commit's build reports instead."
          exit 0
        fi
        if [ "$RESULT" = success ]; then
          body=$(printf '### iOS build passed ✅\n\nThe app compiled, its simulator UI tests passed and an unsigned IPA was built for the latest commit of `%s`.\n\n[Build log and IPA](%s)' "$BRANCH" "$RUN_URL")
        else
          body=$(printf '### iOS build failed ❌ — fixing\n\nThe native iOS build or its simulator tests failed on the latest commit of `%s`. KappaForge is reading the build log and starting a fix automatically.\n\n[Build log](%s)' "$BRANCH" "$RUN_URL")
          gh workflow run agent.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue" -f action=fix || echo "::warning::Could not start the automatic fix; tap Fix it on the Dashboard."
        fi
        marker=$(jq -cn --arg sha "$SHA" --arg kind native --arg conclusion "$RESULT" --argjson task "$issue" --argjson runId "$CHECK_RUN_ID" '{version:1,task:$task,sha:$sha,kind:$kind,conclusion:$conclusion,runId:$runId,workComplete:false}')
        body+=$(printf '\n\n<!-- KAPPA_VALIDATION_V1 %s -->' "$marker")
        gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body" || echo "::warning::Could not post the iOS build result on task $issue."
      shell: bash
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: KappaForge-unsigned-iPhone-IPA
        path: ios
    - name: Publish versioned iPhone release after validated web deployment
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        set -euo pipefail
        main_sha="$(gh api repos/onlykappa/KappaForge/git/ref/heads/main --jq .object.sha)"
        if [ "$main_sha" != "$GITHUB_SHA" ]; then
          # Only a newer commit that changes the app starts its own build (see the push paths above); otherwise
          # this build is still the latest app and must publish, or nothing would.
          app_changes="$(gh api "repos/onlykappa/KappaForge/compare/$GITHUB_SHA...$main_sha" --jq '[.files[].filename | select(test("^(ios|preview|scripts)/|^\\.github/workflows/ios-build\\.yml$"))] | length')"
          if [ "$app_changes" != "0" ]; then
            echo "::notice::main moved on with app changes during this build; the newer commit's build releases instead."
            exit 0
          fi
          echo "main moved on without app changes; publishing this build."
        fi
        VERSION="${{ needs.native.outputs.version }}"
        test -n "$VERSION"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "Version already published; never replace a released IPA."
        else
          { git log -1 --format=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d;/^Co-authored-by:/d'; echo; echo "Install: in KappaForge open Settings → Updates → Check for updates."; } > release-notes.md
          gh release create "v$VERSION" ios/KappaForge-unsigned.ipa --title "KappaForge v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
        fi
      shell: bash
'on':
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'preview/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'preview/**'
      - 'tests/native-update-contract.test.mjs'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'
  workflow_call: null
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate (manual runs never publish)
        required: false
        default: main
        type: string
      candidate_sha:
        description: Exact commit to check out and validate (also names the run)
        required: false
        default: ''
        type: string
defaults:
  run:
    shell: bash

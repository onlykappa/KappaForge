name: iOS simulator build
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to validate, for example kappa/issue-4"
        required: true
        default: "kappa/issue-4"
        type: string
permissions:
  contents: write
jobs:
  build:
    if: startsWith(inputs.branch, 'kappa/issue-')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: projects/kappaforge_ios
        run: xcodegen generate
      - name: Compile iOS Simulator app without signing
        working-directory: projects/kappaforge_ios
        run: |
          xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  native:
    if: github.event_name == 'push' || inputs.branch == ''
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate KappaForge app icon
        run: swift ios/generate-icon.swift
      - name: Generate native project
        working-directory: ios
        run: xcodegen generate
      - name: Compile native simulator app without signing
        working-directory: ios
        run: |
          xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned iPhone device application
        working-directory: ios
        run: |
          xcodebuild -project KappaForge.xcodeproj -scheme KappaForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for SideStore signing
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/KappaForge.app package/Payload/
          cd package
          /usr/bin/zip -qry ../KappaForge-unsigned.ipa Payload
          test -s ../KappaForge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: KappaForge-unsigned-iPhone-IPA
          path: ios/KappaForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish iPhone-downloadable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          VERSION=$(sed -n \"s/.*MARKETING_VERSION: '\\([^']*\\)'.*/\\1/p\" ios/project.yml | head -1)
          test -n \"$VERSION\"
          if gh release view \"v$VERSION\" >/dev/null 2>&1; then
            echo \"Version already released. Bump MARKETING_VERSION for the next IPA.\"
          else
            gh release create \"v$VERSION\" ios/KappaForge-unsigned.ipa --title \"KappaForge v$VERSION\" --notes \"Native iPhone app with bundled interface, icon, and in-app update checking. Download the IPA on iPhone and import into SideStore to sign and update.\" --target \"$GITHUB_SHA\"
          fi

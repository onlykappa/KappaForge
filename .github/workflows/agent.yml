name: KappaForge agent
run-name: "${{ inputs.issue_number != '' && format('Agent task #{0} {1}', inputs.issue_number, inputs.action) || 'Scheduled agent' }}"
permissions:
  contents: read
# One queue per task: a shared group lets GitHub cancel a pending run when a newer task arrives.
concurrency:
  group: kappaforge-agent-${{ inputs.issue_number || 'scheduled' }}
  cancel-in-progress: false
jobs:
  router-check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'router-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Inspect approved configuration and recorded cooldowns without inference
      env:
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
      run: python -m engine.gateway
  classify:
    if: inputs.action != 'router-check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      issue: ${{ steps.scope.outputs.issue }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - name: Classify owner-authorized task with read-only token
      id: scope
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python -m engine.task_scope
      shell: bash
  report-expired:
    needs: classify
    if: needs.classify.outputs.scope == 'expired'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
    - name: Tell the owner why automatic work stopped
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE: ${{ needs.classify.outputs.issue }}
      run: |-
        set -Eeuo pipefail
        [[ "$ISSUE" =~ ^[0-9]+$ ]] || exit 0
        body=$(printf '### KappaForge task failed\n\nThis task is no longer authorized (it expired, or was not started from a direct request), so automatic work on it, including test fixes, has stopped. Send the request again in chat to start a fresh task.')
        gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
      shell: bash
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - name: Analyze authorized KappaForge issue
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KAPPA_ROUTER_REQUIRED: 'true'
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        KAPPA_CODE_PROVIDERS: ${{ vars.KAPPA_CODE_PROVIDERS }}
        KAPPA_PRIVATE_CODE_PROVIDERS: ${{ vars.KAPPA_PRIVATE_CODE_PROVIDERS }}
        KAPPA_CODER_TOKEN: ${{ secrets.KAPPA_CODER_TOKEN }}
        INPUT_ISSUE_NUMBER: ${{ needs.classify.outputs.issue }}
        KAPPA_TASK_SCOPE: read
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        PYTHONUNBUFFERED=1 python -m engine.runner
      shell: bash
    - name: Report task execution failure
      if: failure() && inputs.issue_number != ''
      uses: actions/github-script@v7
      env:
        TASK_NUMBER: ${{ needs.classify.outputs.issue }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      with:
        script: |
          const raw = process.env.TASK_NUMBER;
          if (!/^[1-9][0-9]*$/.test(raw)) return;
          const issue_number = Number(raw);
          const issue = (await github.rest.issues.get({...context.repo, issue_number})).data;
          if (issue.user.login !== 'onlykappa' || !issue.labels.some(l => l.name.toLowerCase() === 'kappa-task')) return;
          // A closed task was cancelled or closed by its owner; stopping it is not a failure to report.
          if (issue.state === 'closed') return;
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({...context.repo, issue_number,
            body: `### KappaForge task failed\n\nThe agent stopped before producing a final report. Earlier findings remain available.\n\n[Open the failed workflow](${url}) to inspect the failing step, correct the reported configuration or execution error, then retry.`});
          const hook = process.env.DISCORD_WEBHOOK_URL || '';
          if (/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(hook))
            await fetch(hook, {method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({content: `❌ KappaForge task #${issue_number} failed: ${issue.title}\n${url}`.slice(0, 1900), allowed_mentions: {parse: []}})}).catch(() => {});
    needs: classify
    if: needs.classify.outputs.scope == 'read'
    permissions:
      contents: read
      issues: write
      actions: write
  code:
    runs-on: ubuntu-latest
    # Staged builds make several long model calls (up to 7 minutes each) plus a test stage.
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install ast-grep for the structural security scan
      shell: bash
      run: python -m pip install --quiet --no-deps --require-hashes -r .github/ast-grep-requirements.txt
    - name: Verify free execution permissions and resource availability
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python -m engine.infrastructure
    - name: Preflight agent tools and build settings
      shell: bash
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        python3 scripts/preflight.py agent
    - name: Analyze authorized KappaForge issue
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KAPPA_ROUTER_REQUIRED: 'true'
        KAPPA_ROUTER_URL: ${{ vars.KAPPA_ROUTER_URL }}
        KAPPA_ROUTER_TOKEN: ${{ secrets.KAPPA_ROUTER_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        KAPPA_CODE_PROVIDERS: ${{ vars.KAPPA_CODE_PROVIDERS }}
        KAPPA_PRIVATE_CODE_PROVIDERS: ${{ vars.KAPPA_PRIVATE_CODE_PROVIDERS }}
        KAPPA_CODER_TOKEN: ${{ secrets.KAPPA_CODER_TOKEN }}
        INPUT_ISSUE_NUMBER: ${{ needs.classify.outputs.issue }}
        INPUT_ACTION: ${{ inputs.action }}
        KAPPA_TASK_SCOPE: write
      run: |-
        set -Eeuo pipefail
        trap 'printf "Error: [workflow] step failed at line %s (exit %s)\n" "$LINENO" "$?" >&2' ERR
        PYTHONUNBUFFERED=1 python -m engine.runner
      shell: bash
    - name: Report task execution failure
      if: (failure() || cancelled()) && inputs.issue_number != ''
      uses: actions/github-script@v7
      env:
        TASK_NUMBER: ${{ needs.classify.outputs.issue }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      with:
        script: |
          const raw = process.env.TASK_NUMBER;
          if (!/^[1-9][0-9]*$/.test(raw)) return;
          const issue_number = Number(raw);
          const issue = (await github.rest.issues.get({...context.repo, issue_number})).data;
          if (issue.user.login !== 'onlykappa' || !issue.labels.some(l => l.name.toLowerCase() === 'kappa-task')) return;
          // A closed task was cancelled or closed by its owner; stopping it is not a failure to report.
          if (issue.state === 'closed') return;
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          // The agent already explained the failure itself on this run; don't add a vaguer second report.
          const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number, per_page: 100});
          // Finalize the live card even when Python was killed before its exception handler ran.
          // A killed authorized development worker is resumed by the trusted recovery queue.
          // Explicit workflow cancellation still stops work.
          const recoveryPending = '${{ job.status }}' !== 'cancelled' && comments.some(c => {
            if (c.user?.login !== 'github-actions[bot]' || !(c.body || '').startsWith('### KappaForge recovery checkpoint\n')) return false;
            const m = c.body.match(/<!-- KAPPA_RECOVERY_V1 (.*?) -->/);
            try { const r = JSON.parse(m?.[1] || '{}'); const digest = require('node:crypto').createHash('sha256').update(issue.body || '').digest('hex'); return r.digest === digest && r.expiresAt > Date.now() && r.run === String(context.runId) && ['running','recovering','waiting'].includes(r.status); } catch { return false; }
          });
          for (const comment of comments) {
            if (comment.user?.type !== 'Bot') continue;
            const match = (comment.body || '').match(/<!-- KAPPA_PROGRESS_V1 ([\s\S]*?) -->/);
            if (!match) continue;
            let state;
            try { state = JSON.parse(match[1]); } catch { continue; }
            if (!String(state.attemptId || '').startsWith(`${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}:`) ||
                String(state.taskId) !== String(issue_number) || !['running','recovering'].includes(state.status)) continue;
            const now = Date.now();
            state.status = recoveryPending ? 'waiting' : 'failed';
            state.updatedAt = now;
            state.finishedAt = recoveryPending ? 0 : now;
            state.revision = Number(state.revision || 0) + 1;
            if (state.execution && typeof state.execution === 'object') {
              state.execution = {...state.execution, status: 'blocked', updatedAt: now, finishedAt: now,
                errorCategory: 'interruption', evidence: 'Workflow stopped before the current execution stage finished'};
              if (['pending','running'].includes(state.execution.finalValidation)) state.execution.finalValidation = 'blocked';
              if (state.execution.currentCommand?.status === 'running')
                state.execution.currentCommand = {...state.execution.currentCommand, status: 'blocked', finishedAt: now,
                  errorCategory: 'interruption', evidence: 'Command completion was not observed; recovery must verify the saved workspace'};
            }
            state.steps = (state.steps || []).filter(s => s.status !== 'queued').map(s =>
              ['running','recovering'].includes(s.status) ? {...s, status: recoveryPending ? 'waiting' : 'failed', finishedAt: recoveryPending ? 0 : now, detail: recoveryPending ? 'Progress saved; automatic recovery queue will resume this task' : 'Workflow stopped before completion'} : s);
            state.activity = [...(state.activity || []), {kind: recoveryPending ? 'fix' : 'error', at: now, text: recoveryPending ? 'Progress saved; waiting for automatic continuation' : 'Workflow stopped; saved draft stages remain available. Use Fix it on an existing draft.'}].slice(-60);
            await github.rest.issues.updateComment({...context.repo, comment_id: comment.id,
              body: comment.body.replace(match[0], `<!-- KAPPA_PROGRESS_V1 ${JSON.stringify(state)} -->`)});
          }
          if (recoveryPending) return;
          if (comments.some(c => (c.body || '').includes(`<!-- KAPPA_FAILED:${context.runId} -->`))) return;
          await github.rest.issues.createComment({...context.repo, issue_number,
            body: `### KappaForge task failed\n\n**Why:** the agent ${'${{ job.status }}' === 'cancelled' ? 'ran out of time or was stopped' : 'crashed'} before it could explain.\n\n**What to do:** reply in chat asking me to try again, ideally with guidance on a smaller first step. [Workflow log](${url})`});
          const hook = process.env.DISCORD_WEBHOOK_URL || '';
          if (/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(hook))
            await fetch(hook, {method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({content: `❌ KappaForge task #${issue_number} failed: ${issue.title}\n${url}`.slice(0, 1900), allowed_mentions: {parse: []}})}).catch(() => {});
    needs: classify
    if: needs.classify.outputs.scope == 'write' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
'on':
  workflow_dispatch:
    inputs:
      issue_number:
        description: KappaForge issue number (blank = next labeled task)
        required: false
        type: string
      action:
        description: Blank to run; fix to repair; verify for saved-candidate checks only; router-check for diagnostics only
        required: false
        type: string
  schedule:
  - cron: 17 */6 * * *
defaults:
  run:
    shell: bash

name: KappaForge
options:
  bundleIdPrefix: com.onlykappa
  deploymentTarget:
    iOS: '17.0'
targets:
  KappaForge:
    type: application
    platform: iOS
    sources:
      - path: KappaForge
        excludes:
          - Web
      - path: KappaForge/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlykappa.KappaForge
        SWIFT_VERSION: '5.9'
        MARKETING_VERSION: '2.2.9'
        CURRENT_PROJECT_VERSION: '20'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: KappaForge
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your personal KappaForge assistant.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose images to share with KappaForge AI.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - KappaForgeUITests
  KappaForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KappaForgeUITests
    dependencies:
      - target: KappaForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlykappa.KappaForge.UITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO

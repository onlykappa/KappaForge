name: KappaForge
options:
  bundleIdPrefix: com.onlykappa
  deploymentTarget:
    iOS: '17.0'
targets:
  KappaForge:
    type: application
    platform: iOS
    sources:
      - path: KappaForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlykappa.KappaForge
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: KappaForge
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose images to share with KappaForge AI.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []

id: hardcoded-secret-js
language: javascript
severity: error
message: writes a key, token or password into the code
rule:
  any:
  - kind: variable_declarator
    all:
    - has:
        field: name
        regex: (?i)(api_?key|secret|token|passw(or)?d|private_?key)$
    - has:
        field: value
        kind: string
        regex: ^['"`][A-Za-z0-9_\-./+=]{20,}['"`]$
  - kind: pair
    all:
    - has:
        field: key
        regex: (?i)(api_?key|secret|token|passw(or)?d|private_?key)['"]?$
    - has:
        field: value
        kind: string
        regex: ^['"`][A-Za-z0-9_\-./+=]{20,}['"`]$

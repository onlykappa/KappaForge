id: hardcoded-secret-py
language: python
severity: error
message: writes a key, token or password into the code
rule:
  kind: assignment
  all:
  - has:
      field: left
      regex: (?i)(api_?key|secret|token|passw(or)?d|private_?key)$
  - has:
      field: right
      kind: string
      regex: ^[rbuRBU]?['"][A-Za-z0-9_\-./+=]{20,}['"]$

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>KappaForge Chat Preview</title><style>
:root{font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f6f6f8;color:#1d1d22}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:255px 1fr;min-height:100dvh}.sidebar{background:#ededef;border-right:1px solid #dddde4;padding:24px 12px}.brand{font-weight:750;font-size:21px;padding:6px 10px 20px}.history{display:block;width:100%;text-align:left;padding:12px;border-radius:11px;border:0;background:transparent;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.history.active,.history:hover{background:#dedee7}.main{min-width:0;position:relative}.top{padding:18px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e4e4e9;background:#f9f9fb}.top strong{font-size:18px}.top span{font-size:12px;color:#777782}.iconbtn{background:#fff;border:1px solid #dddde6;border-radius:12px;padding:9px 12px}.content{max-width:820px;margin:auto;padding:26px 20px 175px}.welcome{text-align:center;margin:15vh auto 30px}.welcome h1{font-size:28px;letter-spacing:-.04em}.muted{color:#777782;font-size:14px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 17px;border-radius:19px;line-height:1.5;max-width:90%;margin:12px 0}.bubble.user{background:#e7e7f1;margin-left:auto;width:fit-content}.bubble.assistant{background:#fff;border:1px solid #e6e6ed}.composer{position:fixed;bottom:0;left:255px;right:0;background:linear-gradient(transparent,#f6f6f8 14%);padding:24px 22px calc(20px + env(safe-area-inset-bottom))}.compose-inner{max-width:780px;margin:auto;background:#fff;border:1px solid #dedee8;border-radius:21px;box-shadow:0 6px 30px #0000000d;padding:12px}.compose-inner textarea{resize:none;width:100%;min-height:49px;max-height:130px;border:0;outline:0;background:transparent;color:inherit;padding:8px}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:0;background:#5456b9;color:white;padding:10px 16px;border-radius:12px;font-weight:650}.btn.secondary{background:#ececf2;color:#292937}.mini{font-size:12px;color:#85858e;margin-top:8px;text-align:center}.menu{display:none}.panel{background:#fff;border:1px solid #e5e5ed;border-radius:18px;padding:18px;margin:12px 0}.row{border-bottom:1px solid #eeeef2;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.row:last-child{border:0}a{color:#5356ad;text-decoration:none}h2{margin-top:8px}.navlink{margin:5px 0}.navlink button{width:100%;padding:11px;text-align:left;border:0;border-radius:11px;background:transparent;color:inherit}.navlink button.active{background:#dcdcec}.hide{display:none}.pill{display:inline-block;background:#ebebf6;color:#5253a1;padding:5px 9px;border-radius:20px;font-size:12px}
@media(max-width:700px){.layout{display:block}.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;width:min(82vw,300px);transform:translateX(-101%);transition:transform .2s;box-shadow:10px 0 30px #0002}.sidebar.open{transform:none}.menu{display:inline-block}.composer{left:0}.top{padding:14px}.content{padding:20px 16px 185px}.welcome{margin-top:12vh}}@media(prefers-color-scheme:dark){:root{background:#151519;color:#f4f4f8}.sidebar{background:#232329;border-color:#35353e}.top{background:#18181e;border-color:#35353e}.history.active,.history:hover,.navlink button.active{background:#363640}.panel,.bubble.assistant,.compose-inner,.iconbtn{background:#24242d;border-color:#3b3b47;color:#f5f5fa}.bubble.user{background:#363652}.btn.secondary{background:#393943;color:white}.composer{background:linear-gradient(transparent,#151519 14%)}.row{border-color:#393943}textarea{color:white}}
.feed{margin:14px 0 18px;border:1px solid #dfdfe9;border-radius:17px;background:#fff;overflow:hidden}.feed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #eeeef3}.feed-head strong{font-size:14px}.feed-head small{color:#777784}.feed-list{max-height:245px;overflow:auto}.feed-entry{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid #f0f0f4}.feed-entry:last-child{border-bottom:0}.feed-dot{font-size:17px}.feed-entry a{font-size:14px;font-weight:600}.feed-entry small{display:block;margin-top:3px;color:#777784}.feed-empty{padding:15px;color:#777784;font-size:13px}.feed-tools button{border:0;background:transparent;color:#5456b9;padding:6px;font-size:12px}.feed-error{color:#a34b13;font-size:12px;padding:8px 15px}@media(prefers-color-scheme:dark){.feed{background:#24242d;border-color:#3b3b47}.feed-head,.feed-entry{border-color:#34343d}}</style></head><body><div class="layout">
<aside id="sidebar" class="sidebar"><div class="brand">✦ KappaForge</div><button class="btn" id="new" style="width:100%">＋ New chat</button><div class="navlink"><button data-page="chat" class="active">◉ Chat</button><button data-page="home">⌂ Dashboard</button><button data-page="projects">▤ Projects</button><button data-page="tasks">☑ Tasks</button><button data-page="reviews">⇄ Reviews</button></div><p class="muted" style="padding-left:10px;margin-top:28px">Recent chats</p><div id="history"></div><p class="muted" style="padding:10px;font-size:12px">Chats are stored in this browser. Connect AI to enable genuine responses.</p></aside>
<section class="main"><div class="top"><button class="iconbtn menu" id="menubtn" aria-label="Open conversations">☰</button><div><strong id="heading">KappaForge Chat</strong><div><span>Private Gemini chat · Connect AI to begin</span></div></div><button class="iconbtn" id="connect" title="Connect private AI backend">⚙ Connect AI</button><button class="iconbtn" id="refresh">↻</button></div><div class="content" id="content"></div>
<div class="composer" id="composer"><div class="compose-inner"><form id="form"><textarea id="message" aria-label="Message" placeholder="Message KappaForge…" required></textarea><div class="controls"><button class="btn secondary" type="button" id="task">Make a task</button><button class="btn" type="submit">Send ↑</button></div></form></div><div class="mini">AI responds when connected. No automatic code edits or GitHub writes.</div></div></section></div>
<script>
const key="kappaforge.preview.chats.v1", esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let backend=localStorage.getItem("kappaforge.backend")||sessionStorage.getItem("kappaforge.backend")||"", access=localStorage.getItem("kappaforge.access")||sessionStorage.getItem("kappaforge.access")||"", sending=false;let activity={runs:[],last:null,error:"",busy:false};let pendingJob=null;let recentJob=null;let chats=[];try{const stored=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(stored))chats=stored.filter(x=>x&&Array.isArray(x.messages)).slice(0,100)}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let current=chats[0]?.id||null,view="chat",data={repos:[],issues:[],prs:[],runs:[],error:"",loaded:false};
function save(){try{localStorage.setItem(key,JSON.stringify(chats))}catch(e){console.warn("Browser storage unavailable")}}
function fresh(){const c={id:uid(),title:"New conversation",messages:[],at:Date.now()};chats.unshift(c);current=c.id;save();view="chat";render();document.getElementById("message").focus()}
function active(){return chats.find(c=>c.id===current)}
function navigate(v){view=v;document.getElementById("sidebar").classList.remove("open");render();if(v==="home")refreshActivity(true)}
function history(){document.getElementById("history").innerHTML=chats.map(c=>'<button class="history '+(c.id===current&&view==="chat"?"active":"")+'" data-id="'+esc(c.id)+'">'+esc(c.title)+'</button>').join("")}
const card=(title,body)=>'<div class="panel"><h3>'+esc(title)+'</h3>'+body+'</div>';
const row=(name,subtitle,url)=>'<div class="row"><div><strong>'+esc(name)+'</strong><div class="muted">'+esc(subtitle)+'</div></div><a href="'+esc(url)+'" target="_blank" rel="noopener">↗</a></div>';
const api=async p=>{const r=await fetch("https://api.github.com/repos/onlykappa/"+p,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub HTTP "+r.status);return r.json()};
async function load(){try{const names=["KappaForge","OmniPC","Apk-revival"];const [r,i,p,w]=await Promise.all([Promise.all(names.map(api)),Promise.all(names.map(n=>api(n+"/issues?state=open&per_page=30").then(x=>x.filter(v=>!v.pull_request).map(v=>({...v,repo:n}))))),Promise.all(names.map(n=>api(n+"/pulls?state=open&per_page=30").then(x=>x.map(v=>({...v,repo:n}))))),api("KappaForge/actions/runs?per_page=10")]);data={repos:r,issues:i.flat(),prs:p.flat(),runs:w.workflow_runs||[],error:"",loaded:true};}catch(e){data.error=e.message}render()}
function render(){
history();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===view));
document.getElementById("heading").textContent=({chat:"KappaForge Chat",home:"Dashboard",projects:"Projects",tasks:"Tasks",reviews:"Reviews"})[view];
document.getElementById("composer").classList.toggle("hide",view!=="chat");
let html="";const c=active();
if(view==="chat"){html=c?.messages.length?c.messages.map(m=>'<div class="bubble '+(m.role==="user"?"user":"assistant")+'">'+esc(m.text)+'</div>').join(""):'<div class="welcome"><div style="font-size:42px;color:#5758ac">✦</div><h1>What should we build today?</h1><p class="muted">Draft an idea, explore a plan, or prepare a new development task.</p><span class="pill">Connect AI to activate live responses</span></div>';}

if(view==="chat"&&pendingJob)html+=jobApproval();
if(view==="chat"&&recentJob)html+=jobResult();
if(view==="home")html=activityPanel()+card("Cloud status",'<p class="muted">Public read-only GitHub data · '+(data.loaded?"Connected":"Loading or unavailable")+'</p>')+card("Recent agent runs",(data.runs||[]).map(x=>row(x.name||"Workflow",x.status+" · "+(x.conclusion||"pending"),x.html_url)).join("")||'<p class="muted">No activity loaded.</p>');
if(view==="projects")html=card("Repositories",data.repos.map(x=>row(x.name,x.description||"Public repository",x.html_url)).join("")||'<p class="muted">No projects loaded.</p>');
if(view==="tasks")html=card("GitHub tasks",'<button class="btn" id="tasknew">＋ New task</button>'+data.issues.map(x=>row("#"+x.number+" "+x.title,x.repo,x.html_url)).join("")||'<p class="muted">No tasks loaded.</p>');
if(view==="reviews")html=card("Pull requests",data.prs.map(x=>row("#"+x.number+" "+x.title,x.repo+(x.draft?" · Draft":""),x.html_url)).join("")||'<p class="muted">No pull requests loaded.</p>');
if(data.error&&view!=="chat")html='<div class="panel">GitHub refresh failed: '+esc(data.error)+'</div>'+html;
document.getElementById("content").innerHTML=html;
if(view==="chat")window.scrollTo({top:document.body.scrollHeight,behavior:"instant"});
document.getElementById("tasknew")?.addEventListener("click",()=>openTask(""));document.getElementById("feedrefresh")?.addEventListener("click",()=>refreshActivity(true));document.getElementById("approvejob")?.addEventListener("click",launchJob);document.getElementById("canceljob")?.addEventListener("click",()=>{pendingJob=null;render()});
}


function jobApproval(){
 return '<div class="panel" style="border:2px solid #5456b9"><span class="pill">Approval required</span><h3>Launch KappaForge job?</h3><p><strong>'+esc(pendingJob.title)+'</strong></p><p class="muted">'+esc(pendingJob.repo)+' · '+esc(pendingJob.mode)+'</p><p style="white-space:pre-wrap">'+esc(pendingJob.instructions)+'</p><button class="btn" id="approvejob">Approve & Launch</button> <button class="btn secondary" id="canceljob">Cancel</button><p class="muted">Only KappaForge sandbox coding or read-only audits are supported. This will create a GitHub issue and attempt workflow dispatch.</p></div>';
}
function jobResult(){
 return '<div class="panel"><h3>Latest job</h3><p>'+esc(recentJob.message)+'</p>'+(recentJob.url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(recentJob.url)+'">Open GitHub issue ↗</a>':'')+'</div>';
}
async function launchJob(){
 if(!pendingJob||!backend||!access){alert("Connect AI before launching a job.");return}
 const job=pendingJob;pendingJob=null;recentJob={message:"Submitting approved job…"};render();
 try{
 const response=await fetch(backend+"/jobs",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+access},body:JSON.stringify({...job,approved:true})});
 const data=await response.json();
 if(!response.ok)throw Object.assign(new Error(data.error||"Request failed"),{url:data.issueUrl});
 recentJob={message:"Job #"+data.issueNumber+" dispatched. Follow progress in Dashboard.",url:data.issueUrl,number:data.issueNumber};
 }catch(e){recentJob={message:"Could not launch: "+e.message,url:e.url};}
 render();
}
function prepareJob(message){
 const text=(message||"").trim();
 if(!text){alert("Write a task in the chat first.");return}
 const title=text.split("\n")[0].slice(0,105);
 const repoChoice=prompt("Repository: KappaForge, OmniPC, or Apk-revival","KappaForge");
 if(repoChoice===null)return;
 const repoMap={"kappaforge":"onlykappa/KappaForge","omnipc":"onlykappa/OmniPC","apk-revival":"onlykappa/Apk-revival"};
 const repo=repoMap[repoChoice.trim().toLowerCase()];
 if(!repo){alert("Choose one of the three authorized repositories.");return}
 const mode=(prompt("Task mode: audit or code (code restricted to KappaForge sandbox)","audit")||"").toLowerCase();
 if(!["audit","code"].includes(mode)){alert("Use audit or code.");return}
 if(mode==="code"&&repo!=="onlykappa/KappaForge"){alert("Code tasks are only authorized in KappaForge.");return}
 pendingJob={title:title.length>=5?title:"KappaForge task",instructions:text.length>=10?text:text+" Please inspect and provide a detailed report.",repo,mode};
 view="chat";render();
}
function activityPanel(){
 const entries=activity.runs.slice(0,6).map(r=>{
   const dot=r.status!=="completed"?"🔄":r.conclusion==="success"?"✅":r.conclusion==="failure"?"❌":"◯";
   const detail=r.status==="completed"?(r.conclusion||"finished"):r.status;
   return '<div class="feed-entry"><span class="feed-dot">'+dot+'</span><div style="min-width:0;flex:1"><a href="'+esc(r.html_url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.name||"Workflow run")+'</a><small>'+esc(detail)+' · '+esc(r.head_branch||"main")+'</small></div></div>';
 }).join("");
 return '<section class="feed" aria-label="Live GitHub activity"><div class="feed-head"><div><strong>◉ Agent activity</strong><div><small>'+esc(activity.last?"Checked "+activity.last.toLocaleTimeString():"Checking GitHub…")+' · refreshes every 90s</small></div></div><div class="feed-tools"><button type="button" id="feedrefresh" '+(activity.busy?"disabled":"")+' aria-label="Refresh agent activity">↻ Refresh</button></div></div><div class="feed-list">'+(entries||'<div class="feed-empty">No GitHub runs loaded yet.</div>')+'</div>'+(activity.error?'<div class="feed-error">'+esc(activity.error)+'</div>':'')+'</section>';
}
async function refreshActivity(force=false){
 if(activity.busy||document.hidden||(!force&&view!=="home"))return;
 activity.busy=true;
 try {
  const response=await fetch("https://api.github.com/repos/onlykappa/KappaForge/actions/runs?per_page=12",{headers:{"Accept":"application/vnd.github+json"}});
  if(!response.ok)throw Error(response.status===403?"GitHub rate limit reached. Try again later.":"GitHub API HTTP "+response.status);
  const result=await response.json();
  activity.runs=(result.workflow_runs||[]).filter(r=>r&&typeof r.html_url==="string"&&r.html_url.startsWith("https://github.com/onlykappa/KappaForge/actions/runs/"));
  activity.last=new Date();activity.error="";
 }catch(e){activity.error=e.message;}
 finally {activity.busy=false;if(view==="home")render()}
}

function openTask(text){const title=(text.trim().split("\n")[0]||"KappaForge development task").slice(0,110),body="Repository: onlykappa/KappaForge\nMode: audit\n\n"+text+"\n\nReview before creating. This browser preview cannot authorize a coding run.";const url="https://github.com/onlykappa/KappaForge/issues/new?"+new URLSearchParams({title,body});window.open(url,"_blank","noopener")}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();if(sending)return;const input=document.getElementById("message"),text=input.value.trim();if(!text)return;if(!active())fresh();const c=active();c.messages.push({role:"user",text});if(c.messages.length===1)c.title=text.slice(0,50);c.at=Date.now();chats=[c,...chats.filter(x=>x.id!==c.id)];save();input.value="";render();if(!backend||!access){c.messages.push({role:"assistant",text:"Your message is saved locally. Tap Connect AI at the top and enter your deployed backend address plus your private access token to receive real responses."});save();render();return}sending=true;const button=document.querySelector("#form button[type=submit]");if(button)button.disabled=true;try{const messages=c.messages.slice(-16).filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,text:m.text}));const response=await fetch(backend+"/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+access},body:JSON.stringify({messages})});const data=await response.json();if(!response.ok)throw Error(data.error||"Service unavailable");c.messages.push({role:"assistant",text:data.reply});}catch(err){c.messages.push({role:"assistant",text:"Connection error: "+err.message+" (tap Connect AI to review settings)"});}finally{sending=false;save();render()}});
document.getElementById("task").addEventListener("click",()=>{const typed=document.getElementById("message").value.trim();const msg=typed||[...(active()?.messages||[])].reverse().find(m=>m.role==="user")?.text||"";prepareJob(msg)});
document.getElementById("connect").addEventListener("click",()=>{if(backend&&access){if(confirm("AI is configured to reconnect automatically on this device. Disconnect and delete the saved access token?")){backend="";access="";localStorage.removeItem("kappaforge.backend");localStorage.removeItem("kappaforge.access");sessionStorage.removeItem("kappaforge.backend");sessionStorage.removeItem("kappaforge.access");updateConnection();}return;}const url=prompt("Private KappaForge Worker URL (https://...workers.dev)",backend);if(url===null)return;let parsed;try{parsed=new URL(url);if(parsed.protocol!=="https:"||!parsed.hostname.endsWith(".workers.dev"))throw Error("invalid")}catch{alert("Enter your HTTPS workers.dev URL.");return}const token=prompt("Private chat access token (saved on this device for automatic reconnection)","");if(token===null||!token.trim())return;backend=parsed.origin;access=token.trim();localStorage.setItem("kappaforge.backend",backend);localStorage.setItem("kappaforge.access",access);sessionStorage.removeItem("kappaforge.backend");sessionStorage.removeItem("kappaforge.access");updateConnection();alert("Connected settings saved. KappaForge will remember this device. Do not use this on shared devices.");});
function updateConnection(){document.getElementById("connect").textContent=backend&&access?"✓ AI Connected":"⚙ Connect AI";}
document.getElementById("new").addEventListener("click",fresh);document.getElementById("menubtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));document.getElementById("refresh").addEventListener("click",load);
document.getElementById("sidebar").addEventListener("click",e=>{const h=e.target.closest("[data-id]"),p=e.target.closest("[data-page]");if(h){current=h.dataset.id;navigate("chat")}if(p)navigate(p.dataset.page)});
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!(/iPhone|iPad|Android/i).test(navigator.userAgent)){e.preventDefault();document.getElementById("form").requestSubmit()}});
updateConnection();render();load();refreshActivity(true);setInterval(()=>refreshActivity(),90000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshActivity()});
</script></body></html>
